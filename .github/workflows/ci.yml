name: CI

on:
  # Weekly, so a green badge means the tests pass now rather
  # than that they passed the day of the last push.
  schedule:
    - cron: "10 6 * * 6"
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pipeline:
    name: Rebuild everything and re-prove every claim
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt ruff

      - name: Lint
        run: ruff check .

      - name: Generate the dataset and its ground truth
        run: python data_generator/generate_marketing_data.py

      - name: Generate the B2B SaaS go-to-market dataset
        run: python saas/generate_gtm_data.py

      # The committed CSVs were written on Windows. If the Linux run produces
      # different bytes, the pipeline is not reproducible and every number in
      # the README is a local accident.
      - name: The regenerated data must match the committed data byte for byte
        run: git diff --exit-code -- data/

      - name: Run the committed SQL
        run: python engine/run_analytics.py

      - name: Grade every attribution model against the planted truth
        run: python attribution/evaluate.py

      - name: Read out the geo holdout
        run: python experiments/incrementality.py

      - name: SaaS unit economics, magic number, CAC by attribution model
        run: python saas/gtm_metrics.py

      - name: Charts
        run: python analytics/make_visuals.py

      - name: Tests
        run: python -m pytest -q

      # The README badge is a claim about this suite, and nothing used to
      # compare the two. healthcare's badge sat at 182 while its suite had
      # grown to 345 -- the number was counting test functions, not collected
      # cases, and no check could see the difference. This fails the build if
      # the badge and the suite ever disagree again.
      - name: The README test badge must match what the suite collects
        run: |
          collected=$(python -m pytest --collect-only -q 2>/dev/null             | grep -oE '[0-9]+ tests? collected' | grep -oE '^[0-9]+')
          claimed=$(grep -oE 'badge/tests-[0-9%C,]+%20passing' README.md | head -1             | sed -E 's|badge/tests-||; s|%20passing||; s|%2C||g; s|,||g')
          echo "suite collects: ${collected:-<none>}   README badge: ${claimed:-<none>}"
          if [ -z "$collected" ] || [ -z "$claimed" ]; then
            echo "::error::could not read one of the two numbers"; exit 1
          fi
          if [ "$collected" != "$claimed" ]; then
            echo "::error::README badge says $claimed, suite collects $collected"; exit 1
          fi
      - name: The app must at least import
        run: python -c "import ast,pathlib; ast.parse(pathlib.Path('app/streamlit_app.py').read_text())"
